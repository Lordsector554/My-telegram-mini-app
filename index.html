<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Mini App</title>

    <!-- Telegram Mini App library -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;

            font-family: Arial, sans-serif;

            background: #f2f2f2;

            color: #222;

            text-align: center;
        }

        .app {
            max-width: 400px;

            margin: 40px auto;

            padding: 30px 20px;

            background: white;

            border-radius: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        #username {
            color: #666;
        }

        .points {
            margin: 30px 0;

            font-size: 28px;

            font-weight: bold;
        }

        button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: #2481cc;

            color: white;

            font-size: 18px;

            font-weight: bold;
        }

        button:active {
            transform: scale(0.97);
        }

    </style>

</head>


<body>

    <div class="app">

        <h1>🚀 My Mini App</h1>

        <p id="username">
            Loading user...
        </p>

        <div class="points">

            ⭐ <span id="points">0</span>

        </div>

        <button onclick="earnPoints()">

            Earn 10 Points

        </button>

    </div>


    <script>

        // Connect to Telegram
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


// Get Telegram user
const user = tg.initDataUnsafe?.user;


// Elements
const usernameElement =
    document.getElementById("username");

const pointsElement =
    document.getElementById("points");


// Make sure Telegram gave us a user
if (!user) {

    usernameElement.textContent =
        "Please open this app inside Telegram.";

} else {

    usernameElement.textContent =
        "Hello, " + user.first_name + "! 👋";


    // Send user to our backend
    fetch("/api/user", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            telegram_id: user.id,

            username: user.username || null,

            first_name: user.first_name

        })

    })

    .then(response => response.json())

    .then(data => {

        console.log("Server response:", data);

        if (data.success) {

            // Get saved points
            pointsElement.textContent =
                data.user.points;

        }

    })

    .catch(error => {

        console.error("Error:", error);

    });

}


// Button
function earnPoints() {

    alert(
        "We haven't connected the points system yet!"
    );

}

    </script>

</body>

</html>
