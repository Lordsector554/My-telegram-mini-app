<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Mini App</title>

    <!-- Telegram Mini App library -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;

            font-family: Arial, sans-serif;

            background: #f2f2f2;

            color: #222;

            text-align: center;
        }

        .app {
            max-width: 400px;

            margin: 40px auto;

            padding: 30px 20px;

            background: white;

            border-radius: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        #username {
            color: #666;
        }

        .points {
            margin: 30px 0;

            font-size: 28px;

            font-weight: bold;
        }

        button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: #2481cc;

            color: white;

            font-size: 18px;

            font-weight: bold;
        }

        button:active {
            transform: scale(0.97);
        }

    </style>

</head>


<body>

    <div class="app">

        <h1>🚀 My Mini App</h1>

        <p id="username">
            Loading user...
        </p>

        <div class="points">

            ⭐ <span id="points">0</span>

        </div>

        <button onclick="earnPoints()">

            Earn 10 Points

        </button>

    </div>


    <script>

        // Connect to Telegram
        const tg = window.Telegram.WebApp;

        // Tell Telegram that the app is ready
        tg.ready();

        // Expand the Mini App
        tg.expand();


        // Get Telegram user information
        const user = tg.initDataUnsafe.user;


        // Display the user's name
        if (user) {

            document.getElementById("username").textContent =
                "Hello, " + user.first_name + "! 👋";

        } else {

            document.getElementById("username").textContent =
                "Hello! 👋";

        }


        // Starting points
        let points = 0;


        // Function for the button
        function earnPoints() {

            points += 10;

            document.getElementById("points").textContent =
                points;

        }

    </script>

</body>

</html>
